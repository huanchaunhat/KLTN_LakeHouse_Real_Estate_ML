version: 2

models:
  - name: listing_history
    description: >
      Full valid snapshot history for Nhà Tốt listings.
      Grain: one valid listing observation per crawl snapshot.

    columns:
      - name: observation_id
        description: Unique identifier of the observation.
        tests:
          - unique
          - not_null

      - name: listing_key
        description: Stable identifier for one source listing.
        tests:
          - not_null

      - name: source_listing_id
        tests:
          - not_null

      - name: crawl_timestamp
        tests:
          - not_null

      - name: is_valid_observation
        tests:
          - not_null

      - name: change_type
        tests:
          - not_null
          - accepted_values:
              values:
                - NEW
                - PRICE_CHANGED
                - UPDATED
                - UNCHANGED

      - name: listing_status
        description: Backward-compatible alias of change_type.
        tests:
          - not_null
          - accepted_values:
              values:
                - NEW
                - PRICE_CHANGED
                - UPDATED
                - UNCHANGED


  - name: listing_current
    description: >
      Latest valid observation for each Nhà Tốt source listing.
      Grain: one row per listing_key.

    columns:
      - name: listing_key
        tests:
          - unique
          - not_null

      - name: observation_id
        tests:
          - unique
          - not_null

      - name: source_listing_id
        tests:
          - not_null

      - name: crawl_timestamp
        tests:
          - not_null

      - name: is_valid_observation
        tests:
          - not_null

      - name: change_type
        tests:
          - not_null
          - accepted_values:
              values:
                - NEW
                - PRICE_CHANGED
                - UPDATED
                - UNCHANGED


  - name: listing_quarantine
    description: >
      Observations rejected from valid Silver history by dbt
      data-quality rules. Keeps quality errors and Bronze lineage
      for investigation and reconciliation.

    columns:
      - name: observation_id
        tests:
          - unique
          - not_null

      - name: source_listing_id
        tests:
          - not_null

      - name: snapshot_id
        tests:
          - not_null

      - name: crawl_timestamp
        tests:
          - not_null

      - name: primary_quality_flag
        tests:
          - not_null

      - name: data_quality_flag
        tests:
          - not_null

      - name: is_valid_observation
        tests:
          - not_null