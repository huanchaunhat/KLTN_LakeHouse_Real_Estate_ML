version: 2

models:
  - name: int_listing_changes
    description: >
      Valid Nhà Tốt observations enriched with previous observation
      information and listing change classification.

    columns:
      - name: observation_id
        tests:
          - unique
          - not_null

      - name: listing_key
        tests:
          - not_null

      - name: source_listing_id
        tests:
          - not_null

      - name: crawl_timestamp
        tests:
          - not_null

      - name: previous_price_vnd
        description: Price observed in the immediately preceding valid snapshot.

      - name: price_change_vnd
        description: Current price minus previous observed price.

      - name: price_change_pct
        description: Percentage price change from the previous valid observation.

      - name: change_type
        description: Business change between this observation and the previous one.
        tests:
          - not_null
          - accepted_values:
              values:
                - NEW
                - PRICE_CHANGED
                - UPDATED
                - UNCHANGED

      - name: listing_status
        description: >
          Backward-compatible alias of change_type during Phase A migration.
        tests:
          - not_null
          - accepted_values:
              values:
                - NEW
                - PRICE_CHANGED
                - UPDATED
                - UNCHANGED

  - name: int_listing_enriched
    description: >
      Valid observations (listing_history) prepared for Gold: cleaned
      project/legal values, per-segment price/area outlier flags and
      snapshot completeness. Grain: one valid observation per snapshot.

    columns:
      - name: observation_id
        tests:
          - unique
          - not_null

      - name: is_full_snapshot
        description: From int_crawl_snapshots.
        tests:
          - not_null

      - name: is_initial_load_snapshot
        description: The observation belongs to the initial load (int_crawl_snapshots.is_initial_load).
        tests:
          - not_null

      - name: is_price_outlier
        tests:
          - not_null

      - name: outlier_reason
        tests:
          - accepted_values:
              values:
                - NON_POSITIVE_PRICE
                - NON_POSITIVE_AREA
                - PRICE_PER_M2_OUT_OF_RANGE
                - AREA_OUT_OF_RANGE

  - name: int_crawl_snapshots
    description: >
      One row per crawl run. Single source of snapshot order (by start time,
      never by snapshot_id), completeness and initial load for Silver and Gold.

    columns:
      - name: snapshot_id
        tests:
          - unique
          - not_null

      - name: snapshot_started_at
        tests:
          - not_null

      - name: snapshot_seq
        tests:
          - unique
          - not_null

      - name: online_listing_count
        description: Listings reached by the run with any response other than 404/410.

      - name: is_full_snapshot
        description: >
          True when online_listing_count is at least full_snapshot_min_ratio of
          the largest run. Only full runs may conclude that a listing is gone.
        tests:
          - not_null

      - name: is_initial_load
        description: Run started at or before the first full run.
        tests:
          - not_null

  - name: int_listing_removals
    description: >
      When each listing left the market: the first 404/410, or the next full
      run that did not reach it, after the last run it was online in.
      Rate-limited and quarantined observations count as online.
      Grain: one row per removed listing.

    columns:
      - name: listing_key
        tests:
          - unique
          - not_null

      - name: removed_snapshot_id
        tests:
          - not_null
          - relationships:
              to: ref('int_crawl_snapshots')
              field: snapshot_id

      - name: removed_at
        tests:
          - not_null

      - name: removal_evidence
        tests:
          - not_null
          - accepted_values:
              values:
                - GONE_STATUS
                - ABSENT_FROM_FULL_SNAPSHOT
