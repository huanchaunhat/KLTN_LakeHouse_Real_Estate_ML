version: 2

models:
  - name: int_listing_changes
    description: >
      Valid Nhà Tốt observations enriched with previous observation
      information and listing change classification.

    columns:
      - name: observation_id
        tests:
          - unique
          - not_null

      - name: listing_key
        tests:
          - not_null

      - name: source_listing_id
        tests:
          - not_null

      - name: crawl_timestamp
        tests:
          - not_null

      - name: previous_price_vnd
        description: Price observed in the immediately preceding valid snapshot.

      - name: price_change_vnd
        description: Current price minus previous observed price.

      - name: price_change_pct
        description: Percentage price change from the previous valid observation.

      - name: change_type
        description: Business change between this observation and the previous one.
        tests:
          - not_null
          - accepted_values:
              values:
                - NEW
                - PRICE_CHANGED
                - UPDATED
                - UNCHANGED

      - name: listing_status
        description: >
          Backward-compatible alias of change_type during Phase A migration.
        tests:
          - not_null
          - accepted_values:
              values:
                - NEW
                - PRICE_CHANGED
                - UPDATED
                - UNCHANGED

  - name: int_listing_enriched
    description: >
      Valid observations (listing_history) prepared for Gold: cleaned
      project/legal values, per-segment price/area outlier flags and
      snapshot completeness. Grain: one valid observation per snapshot.

    columns:
      - name: observation_id
        tests:
          - unique
          - not_null

      - name: is_full_snapshot
        description: True when the snapshot covers at least full_snapshot_min_ratio of the largest snapshot.
        tests:
          - not_null

      - name: is_price_outlier
        tests:
          - not_null

      - name: outlier_reason
        tests:
          - accepted_values:
              values:
                - NON_POSITIVE_PRICE
                - NON_POSITIVE_AREA
                - PRICE_PER_M2_OUT_OF_RANGE
                - AREA_OUT_OF_RANGE
